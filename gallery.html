<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EG Microphones</title>
  <link rel="stylesheet" href="style.css" />  
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
</head>

<body>

  <div id="site-header"></div>

  <main>
    <section class="page-header">
      <div class="container">
        <p class="section-label">Behind the Craft</p>
        <h1>Gallery</h1>
        <p>Photos from our workshop and our mics in use</p>
      </div>
    </section>

    <section class="gallery-grid-section">
      <div class="container">
        <div class="gallery-grid">
          <img src="making1.jpg">
          <img src="./gallery/capsule.jpg">
          <img src="./gallery/office.jpg">
          <img src="./gallery/pcb.jpg">
          <img src="./gallery/studio.jpg">
          <img src="EG-1.webp">
          <img src="eg-d.jpg">
          <img src="eg-r.jpg">
          <img src="eg-usb.png">
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <p class="section-label">Featured Shots</p>
        <h2>Carousel Gallery</h2>

        <div class="carousel">
          <div><img src="making1.jpg" alt="Workshop photo"></div>
          <div><img src="./gallery/capsule.jpg" alt="Capsule"></div>
          <div><img src="./gallery/office.jpg" alt="Office"></div>
          <div><img src="./gallery/pcb.jpg" alt="PCB"></div>
          <div><img src="./gallery/studio.jpg" alt="Studio"></div>
          <div><img src="./logo.png" alt="Logo"></div>
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script src="main.js"></script>
</body>

</html>
